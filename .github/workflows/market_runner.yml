name: Trading 212 Market Hours Live Runner

on:
  schedule:
    # ── London Stock Exchange (08:00 - 16:30 UTC / 09:00 - 17:30 CET, Mon-Fri) ──
    # Morning Session: 07:55 UTC (08:55 CET) - boots 5m before open, avoids :00 queue traffic
    - cron: '55 7 * * 1-5'
    # Afternoon Session: 12:25 UTC (13:25 CET) - avoids :30 queue traffic
    - cron: '25 12 * * 1-5'

  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duration in minutes to run the engine (max 350 for GitHub Actions)'
        required: true
        default: '270'
        type: string

permissions:
  contents: write

jobs:
  run-market-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛡️ Pre-Flight Market Hours Guard
        id: market_check
        run: |
          # If triggered manually via workflow_dispatch, always allow running (e.g. for testing)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected. Bypassing market hours guard."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Evaluated in UTC
          DOW=$(date -u +%u) # 1=Monday ... 7=Sunday
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          CURRENT_MINS=$(( 10#$HOUR * 60 + 10#$MINUTE ))

          # Weekend check
          if [ "$DOW" -gt 5 ]; then
            echo "⏸️ Today is weekend (DOW: $DOW). European markets (LSE) are CLOSED."
            echo "Exiting scheduled run immediately to conserve runner minutes."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # London Stock Exchange (LSE) is open 08:00 - 16:30 UTC (09:00 - 17:30 CET)
          # Allowed execution window: 07:50 UTC (470 mins) to 16:35 UTC (995 mins)
          if [ "$CURRENT_MINS" -lt 470 ] || [ "$CURRENT_MINS" -gt 995 ]; then
            echo "⏸️ Current time is $(date -u +'%H:%M UTC') ($(date +'%H:%M %Z')). European markets (LSE) are CLOSED."
            echo "LSE Trading Hours: 08:00 - 16:30 UTC / 09:00 - 17:30 CET."
            echo "This scheduled run was delayed by GitHub Actions queue or fired off-hours."
            echo "Exiting immediately to prevent running at night and conserve GitHub runner minutes."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✅ Market hours check passed: $(date -u +'%H:%M UTC') is within LSE trading window (07:50 - 16:35 UTC)."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: 🐍 Set up Python 3.11
        if: steps.market_check.outputs.should_run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        if: steps.market_check.outputs.should_run != 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r trading_system/requirements.txt

      - name: 🌐 Install Cloudflare Quick Tunnel
        if: steps.market_check.outputs.should_run != 'false'
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: 🚀 Start Cloudflare Tunnel & Extract Live Dashboard URL
        id: tunnel
        if: steps.market_check.outputs.should_run != 'false'
        run: |
          nohup cloudflared tunnel --url http://127.0.0.1:8080 > /tmp/cloudflared.log 2>&1 &
          sleep 5
          TUNNEL_URL=""
          for i in {1..12}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            echo "### 📊 Live Trading Dashboard" >> $GITHUB_STEP_SUMMARY
            echo "Access your live signals and control workbench anywhere (phone/desktop):" >> $GITHUB_STEP_SUMMARY
            echo "👉 **[Open Live Dashboard]($TUNNEL_URL)** (\`$TUNNEL_URL\`)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "=========================================================="
            echo "🎉 LIVE DASHBOARD ONLINE AT: $TUNNEL_URL"
            echo "=========================================================="
          else
            echo "⚠️ Could not extract Cloudflare tunnel URL; logs:"
            cat /tmp/cloudflared.log || true
          fi

      - name: 📈 Execute Quantitative Leveraged Trading Engine
        if: steps.market_check.outputs.should_run != 'false'
        env:
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
          USE_LIVE: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DASHBOARD_HOST: '0.0.0.0'
          DASHBOARD_PORT: '8080'
          LIVE_DASHBOARD_PUBLIC_URL: ${{ env.TUNNEL_URL }}
        run: |
          # Calculate session duration
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            CURRENT_MINS=$(( 10#$HOUR * 60 + 10#$MINUTE ))
            MARKET_CLOSE_MINS=995 # 16:35 UTC
            REMAINING_MINS=$(( MARKET_CLOSE_MINS - CURRENT_MINS ))
            
            # Morning session cap: 270m, Afternoon cap: remaining mins until 16:35 UTC
            if [ "$REMAINING_MINS" -le 0 ]; then
              echo "Market already closed (past 16:35 UTC). Exiting."
              exit 0
            elif [ "$REMAINING_MINS" -lt 270 ]; then
              DURATION="$REMAINING_MINS"
            else
              DURATION="270"
            fi
            echo "⏱️ Dynamically calculated session duration: ${DURATION}m (Market closes at 16:35 UTC / 17:35 CET)"
          else
            DURATION="${{ inputs.duration_minutes || '270' }}"
            echo "⏱️ Manual session duration: ${DURATION}m"
          fi

          export USE_LIVE="true"
          
          echo "=========================================================="
          echo "🚀 Starting Quantitative Leveraged Trading Engine"
          echo "⏱️ Duration: ${DURATION}m"
          echo "⚙️ Mode: USE_LIVE=true (LIVE REAL MONEY on live.trading212.com)"
          echo "🌐 Market Data Providers:"
          [ -n "${POLYGON_API_KEY}" ] && echo "  - Polygon.io: CONFIGURED (Key Detected)" || echo "  - Polygon.io: Not configured"
          [ -n "${FMP_API_KEY}" ] && echo "  - Financial Modeling Prep (FMP): CONFIGURED (Key Detected)" || echo "  - FMP: Not configured"
          [ -n "${TIINGO_API_KEY}" ] && echo "  - Tiingo: CONFIGURED (Key Detected)" || echo "  - Tiingo: Not configured"
          [ -n "${ALPHA_VANTAGE_API_KEY}" ] && echo "  - Alpha Vantage: CONFIGURED (Key Detected)" || echo "  - Alpha Vantage: Not configured"
          echo "  - Direct Yahoo Chart API: ACTIVE (Keyless fallback)"
          echo "  - Stooq CSV: ACTIVE (Keyless fallback)"
          echo "=========================================================="
          
          python3 -m trading_system.orchestrator \
            --interval 5 \
            --monitor-interval 10 \
            --dashboard-port 8080 \
            --dashboard-host 0.0.0.0 \
            --duration-minutes "$DURATION"

      - name: 💾 Synchronize Active Trades State to Repository
        if: always() && steps.market_check.outputs.should_run != 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Market Runner"
          git pull origin main --rebase || true
          git add active_trades.json trades.jsonl data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(state): persist active trades from market runner [skip ci]"
            git push origin main
            echo "✅ Successfully synced active trades and logs back to main."
          else
            echo "ℹ️ No changes in active trades or logs to persist."
          fi
